global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'webhook-system'
    static_configs:
      - targets: ['192.168.0.226:3333']
    scrape_interval: 5s
    metrics_path: /metrics/prometheus
    
  - job_name: 'webhook-health'
    static_configs:
      - targets: ['192.168.0.226:3333']
    scrape_interval: 30s
    metrics_path: /health